spring.application.name=judi
spring.datasource.url=jdbc:mysql://${APP_SERVER_ADDRESS}:${APP_SERVER_DB_PORT}/${APP_SERVER_DB_NAME}
spring.datasource.username=${APP_DB_USERNAME}
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.driverClassName=${APP_DB_DRIVER}

spring.servlet.multipart.max-file-size=${APP_VIDEO_MAXSIZE:500MB}
spring.servlet.multipart.max-request-size=${APP_VIDEO_MAXSIZE:500MB}
server.tomcat.max-http-form-post-size=${APP_VIDEO_MAXSIZE:500MB}
server.tomcat.max-swallow-size=${APP_VIDEO_MAXSIZE:500MB}

spring.threads.virtual.enabled=true

spring.jpa.hibernate.ddl-auto=${APP_BD_DDLAUTO:update}
spring.jpa.show-sql=${APP_SHOWSQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
server.servlet.session.timeout=${APP_TIMEOUT:200m}
server.servlet.context-path=${APP_CONTEXTPATH:/judi}
server.port=${APP_PORT:8020}

spring.mail.host=${APP_EMAIL_HOST}
spring.mail.port=${APP_EMAIL_PORT}
spring.mail.username=${APP_EMAIL_USERNAME}
spring.mail.password=${APP_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${APP_EMAIL_SMTPAUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${APP_EMAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${APP_EMAIL_SSLENABLE:false}
spring.mail.protocol=${APP_EMAIL_PROTOCOL:smtp}

learn.security.failedlogin.count=${APP_FAIL2BAN:3}
learn.email.copia=${APP_EMAIL_COPIAOCULTA}

upload.dir=${APP_DIR:/home/suporte/judi/ged/}

learn.seguranca.base-url=${APP_SEGURANCA_BASEURL:http://localhost:8080/judi}

# Integração com a API Pública do DataJud (CNJ) - acompanhamento automático de processos.
# Enquanto DATAJUD_API_KEY não for preenchida, a sincronização diária fica inativa
# (os processos monitorados ficam marcados com erro de consulta, sem quebrar a aplicação).
datajud.enabled=${DATAJUD_ENABLED:false}
datajud.api-key=${DATAJUD_API_KEY:}
datajud.base-url=${DATAJUD_BASE_URL:https://api-publica.datajud.cnj.jus.br}
datajud.sync-cron=${DATAJUD_SYNC_CRON:0 0 6 * * *}




